name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # The worktree tests drive real git, so it needs an identity to commit as.
      - name: Configure git for worktree tests
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"

      - run: npm test

      # Proves the whole pipeline still runs end to end, with no credentials.
      - run: npm run demo
